{% extends "base.html" %}
{% block title %}Alertas · Bandeja SOC{% endblock %}
{% block content %}
<section class="page-heading"><div><p class="eyebrow">INVESTIGACIÓN</p><h1>Alertas</h1><p>Filtra y abre la evidencia de cada señal.</p></div></section>
<form class="filters" method="get">
  <label>Severidad<select name="severity"><option value="">Todas</option>{% for value in ['critical','high','medium','low'] %}<option value="{{ value }}" {% if filters.severity == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
  <label>Estado<select name="status"><option value="">Todos</option>{% for value in ['new','notified','investigating','resolved','false_positive'] %}<option value="{{ value }}" {% if filters.status == value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
  <label>Regla<input name="rule_id" value="{{ filters.rule_id or '' }}" placeholder="AUTH_..."></label>
  <button class="secondary-button" type="submit">Aplicar filtros</button>
</form>
<section class="panel table-panel">{% include "partials/alerts_table.html" %}</section>
{% endblock %}
